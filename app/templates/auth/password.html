{% extends "base.html" %}
{% set page_title = "Change password" %}

{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<section class="page-head">
  <h2>{{ page_title }}</h2>
  <p class="muted">Signed in as {{ current_user.display_name }}</p>
</section>

<section class="panel">
  <form class="form form-grid" method="post" action="{{ url_for('auth.change_password') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="field field-wide">
      <label for="f-current">Current password</label>
      <input type="password" id="f-current" name="current_password"
             autocomplete="current-password" required>
    </div>

    <div class="field">
      <label for="f-new">New password</label>
      <input type="password" id="f-new" name="new_password"
             autocomplete="new-password" minlength="8" required>
      <small class="muted">At least 8 characters.</small>
    </div>

    <div class="field">
      <label for="f-confirm">Confirm new password</label>
      <input type="password" id="f-confirm" name="confirm_password"
             autocomplete="new-password" minlength="8" required>
    </div>

    <div class="form-actions field-wide">
      <button class="btn" type="submit">Update password</button>
      <a class="btn btn-outline" href="{{ url_for('dashboard.index') }}">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
