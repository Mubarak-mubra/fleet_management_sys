{% if pages > 1 %}
<nav class="pagination">
  {% if page > 1 %}
    <a href="{{ url_for(endpoint, page=page - 1, **filters) }}">&laquo; Prev</a>
  {% else %}
    <span class="page-disabled">&laquo; Prev</span>
  {% endif %}
  <span class="page-info">Page {{ page }} of {{ pages }} ({{ total }} records)</span>
  {% if page < pages %}
    <a href="{{ url_for(endpoint, page=page + 1, **filters) }}">Next &raquo;</a>
  {% else %}
    <span class="page-disabled">Next &raquo;</span>
  {% endif %}
</nav>
{% endif %}
